services:

  backend:
    image: dip9564/assignment-backend:latest
    container_name: assignment_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: dip9564/assignment-frontend:latest
    container_name: assignment_frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped